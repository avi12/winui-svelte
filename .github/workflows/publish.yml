name: Publish

# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push --tags).
# Lint and tests are ci.yml's, which must be green on the tagged commit; this builds and publishes.
# npm trusted publishing: the workflow signs in to npm with its GitHub OIDC identity
# (id-token: write), so no token is stored anywhere. The package's npm settings name
# this repository, this workflow file and the environment "npm" as its trusted publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Cache the restored SDK and bindings
        uses: actions/cache@v4
        with:
          path: .winapp
          key: winapp-${{ hashFiles('winapp.yaml', 'package.json') }}
      - run: pnpm restore
      - run: pnpm build
      - name: The tag must match package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }
      - run: pnpm publish --provenance --access public --no-git-checks
