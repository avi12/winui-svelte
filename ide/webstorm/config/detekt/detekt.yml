# detekt = the correctness half (as in sb-companion)
# buildUponDefaultConfig=true keeps detekt default correctness rules.

build:
  maxIssues: 0   # correctness = error, like oxlint's categories.correctness

# Formatting is owned by ktlint (.editorconfig); the detekt-formatting ruleset is
# not on the classpath, so nothing here double-reports style.

style:
  VarCouldBeVal:
    active: true
  BracesOnIfStatements:
    active: true
    singleLine: 'always'
    multiLine: 'always'
  BracesOnWhenStatements:
    active: true
    singleLine: 'necessary'
    multiLine: 'consistent'
  MandatoryBracesLoops:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: true
  UnusedImports:
    active: true
  UnnecessaryAbstractClass:
    active: true
  UnnecessaryLet:
    active: true
  CanBeNonNullable:
    active: true
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
  VariableNaming:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true

complexity:
  LongMethod:
    active: true
  LongParameterList:
    active: true
  TooManyFunctions:
    active: true
  NestedBlockDepth:
    active: true
  ComplexCondition:
    active: true
  CyclomaticComplexMethod:
    active: true
  CognitiveComplexMethod:
    active: true
